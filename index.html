<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #1e293b;
        }

        .header {
            background: #172033;
            color: white;
            padding: 22px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            margin: 5px 0 0;
            color: #b8c2d1;
            font-size: 14px;
        }

        .container {
            width: 88%;
            margin: 30px auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
        }

        .card p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        .card h2 {
            margin: 10px 0 0;
            font-size: 25px;
        }

        .box {
            background: white;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
        }

        .box-title {
            margin: 0 0 20px;
            font-size: 20px;
        }

        .form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #2563eb;
        }

        .form-buttons {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #334155;
            display: none;
        }

        .tools {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .search {
            flex: 1;
            min-width: 230px;
        }

        .search input,
        .tools select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            background: white;
        }

        .filter {
            width: 180px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #172033;
            color: white;
            padding: 13px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        tr:hover td {
            background: #f8fafc;
        }

        .department {
            background: #e0f2fe;
            color: #0369a1;
            padding: 5px 9px;
            border-radius: 15px;
            font-size: 12px;
        }

        .salary {
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        .footer {
            text-align: center;
            color: #64748b;
            padding: 20px;
            font-size: 13px;
        }

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .form {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .header {
                padding: 18px 5%;
            }

            .header h1 {
                font-size: 20px;
            }

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .form {
                grid-template-columns: 1fr;
            }

            .form-buttons {
                flex-direction: column;
            }

            .form-buttons button {
                width: 100%;
            }

        }

    </style>
</head>

<body>

    <div class="header">

        <div>
            <h1>Employee Management</h1>
            <p>Employee registration and management system</p>
        </div>

        <div>
            Admin
        </div>

    </div>


    <div class="container">


        <div class="cards">

            <div class="card">
                <p>Total Employees</p>
                <h2 id="totalEmployees">0</h2>
            </div>

            <div class="card">
                <p>Departments</p>
                <h2 id="totalDepartments">0</h2>
            </div>

            <div class="card">
                <p>Total Salaries</p>
                <h2 id="totalSalary">0</h2>
            </div>

            <div class="card">
                <p>Average Salary</p>
                <h2 id="averageSalary">0</h2>
            </div>

        </div>


        <div class="box">

            <h2 class="box-title" id="formTitle">
                Add New Employee
            </h2>

            <div class="form">

                <div class="input-group">

                    <label>Employee Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter employee name"
                    >

                </div>


                <div class="input-group">

                    <label>Age</label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter age"
                    >

                </div>


                <div class="input-group">

                    <label>Phone</label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                    >

                </div>


                <div class="input-group">

                    <label>Job</label>

                    <input
                        type="text"
                        id="job"
                        placeholder="Enter job title"
                    >

                </div>


                <div class="input-group">

                    <label>Department</label>

                    <select id="department">

                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Sales">Sales</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Finance">Finance</option>

                    </select>

                </div>


                <div class="input-group">

                    <label>Salary</label>

                    <input
                        type="number"
                        id="salary"
                        placeholder="Enter salary"
                    >

                </div>


                <div class="input-group">

                    <label>City</label>

                    <select id="city">

                        <option value="">Select City</option>
                        <option value="Cairo">Cairo</option>
                        <option value="Giza">Giza</option>
                        <option value="Alexandria">Alexandria</option>
                        <option value="Mansoura">Mansoura</option>
                        <option value="Tanta">Tanta</option>

                    </select>

                </div>


                <div class="input-group">

                    <label>Address</label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter address"
                    >

                </div>


                <div class="form-buttons">

                    <button
                        class="add-btn"
                        id="saveButton"
                        onclick="saveEmployee()"
                    >
                        Add Employee
                    </button>

                    <button
                        class="cancel-btn"
                        id="cancelButton"
                        onclick="cancelEdit()"
                    >
                        Cancel
                    </button>

                </div>

            </div>

        </div>


        <div class="box">

            <h2 class="box-title">
                Employees List
            </h2>


            <div class="tools">

                <div class="search">

                    <input
                        type="text"
                        id="search"
                        placeholder="Search by name, email or phone..."
                    >

                </div>


                <div class="filter">

                    <select id="departmentFilter">

                        <option value="">All Departments</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Sales">Sales</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Finance">Finance</option>

                    </select>

                </div>


                <div class="filter">

                    <select id="cityFilter">

                        <option value="">All Cities</option>
                        <option value="Cairo">Cairo</option>
                        <option value="Giza">Giza</option>
                        <option value="Alexandria">Alexandria</option>
                        <option value="Mansoura">Mansoura</option>
                        <option value="Tanta">Tanta</option>

                    </select>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Job</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>City</th>
                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="employeeTable"></tbody>

                </table>

            </div>

        </div>


        <div class="footer">

            Employee Management System

        </div>

    </div>


    <script>

        let employees = JSON.parse(localStorage.getItem("employees")) || [];

        let editId = null;


        function saveEmployee() {

            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let phone = document.getElementById("phone").value;
            let email = document.getElementById("email").value;
            let job = document.getElementById("job").value;
            let department = document.getElementById("department").value;
            let salary = document.getElementById("salary").value;
            let city = document.getElementById("city").value;
            let address = document.getElementById("address").value;


            if (
                name == "" ||
                age == "" ||
                phone == "" ||
                email == "" ||
                job == "" ||
                department == "" ||
                salary == "" ||
                city == "" ||
                address == ""
            ) {

                alert("Please enter all employee information.");

                return;
            }


            if (editId == null) {

                let employee = {

                    id: Date.now(),

                    name: name,

                    age: age,

                    phone: phone,

                    email: email,

                    job: job,

                    department: department,

                    salary: Number(salary),

                    city: city,

                    address: address

                };

                employees.push(employee);

            } else {

                for (let i = 0; i < employees.length; i++) {

                    if (employees[i].id == editId) {

                        employees[i].name = name;
                        employees[i].age = age;
                        employees[i].phone = phone;
                        employees[i].email = email;
                        employees[i].job = job;
                        employees[i].department = department;
                        employees[i].salary = Number(salary);
                        employees[i].city = city;
                        employees[i].address = address;

                    }

                }

                editId = null;

                document.getElementById("formTitle").innerText =
                    "Add New Employee";

                document.getElementById("saveButton").innerText =
                    "Add Employee";

                document.getElementById("cancelButton").style.display =
                    "none";

            }


            localStorage.setItem(
                "employees",
                JSON.stringify(employees)
            );


            clearForm();

            showEmployees();

            updateCards();

        }


        function showEmployees() {

            let search =
                document.getElementById("search").value.toLowerCase();

            let department =
                document.getElementById("departmentFilter").value;

            let city =
                document.getElementById("cityFilter").value;


            let result = employees.filter(function(employee) {

                let searchResult =
                    employee.name.toLowerCase().includes(search) ||
                    employee.email.toLowerCase().includes(search) ||
                    employee.phone.toLowerCase().includes(search);

                let departmentResult =
                    department == "" ||
                    employee.department == department;

                let cityResult =
                    city == "" ||
                    employee.city == city;

                return searchResult &&
                       departmentResult &&
                       cityResult;

            });


            let table =
                document.getElementById("employeeTable");

            table.innerHTML = "";


            if (result.length == 0) {

                table.innerHTML =
                    "<tr>" +
                    "<td colspan='10' class='empty'>" +
                    "No employees found" +
                    "</td>" +
                    "</tr>";

                return;
            }


            for (let i = 0; i < result.length; i++) {

                table.innerHTML +=

                    "<tr>" +

                    "<td>" +
                    (i + 1) +
                    "</td>" +

                    "<td>" +
                    result[i].name +
                    "</td>" +

                    "<td>" +
                    result[i].age +
                    "</td>" +

                    "<td>" +
                    result[i].phone +
                    "</td>" +

                    "<td>" +
                    result[i].email +
                    "</td>" +

                    "<td>" +
                    result[i].job +
                    "</td>" +

                    "<td>" +
                    "<span class='department'>" +
                    result[i].department +
                    "</span>" +
                    "</td>" +

                    "<td class='salary'>" +
                    result[i].salary.toLocaleString() +
                    "</td>" +

                    "<td>" +
                    result[i].city +
                    "</td>" +

                    "<td>" +

                    "<div class='actions'>" +

                    "<button class='edit-btn' onclick='editEmployee(" +
                    result[i].id +
                    ")'>" +
                    "Edit" +
                    "</button>" +

                    "<button class='delete-btn' onclick='deleteEmployee(" +
                    result[i].id +
                    ")'>" +
                    "Delete" +
                    "</button>" +

                    "</div>" +

                    "</td>" +

                    "</tr>";

            }

        }


        function editEmployee(id) {

            let employee = null;


            for (let i = 0; i < employees.length; i++) {

                if (employees[i].id == id) {

                    employee = employees[i];

                }

            }


            if (employee == null) {

                return;

            }


            document.getElementById("name").value =
                employee.name;

            document.getElementById("age").value =
                employee.age;

            document.getElementById("phone").value =
                employee.phone;

            document.getElementById("email").value =
                employee.email;

            document.getElementById("job").value =
                employee.job;

            document.getElementById("department").value =
                employee.department;

            document.getElementById("salary").value =
                employee.salary;

            document.getElementById("city").value =
                employee.city;

            document.getElementById("address").value =
                employee.address;


            editId = id;


            document.getElementById("formTitle").innerText =
                "Edit Employee";

            document.getElementById("saveButton").innerText =
                "Save Changes";

            document.getElementById("cancelButton").style.display =
                "block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        function deleteEmployee(id) {

            let answer =
                confirm("Are you sure you want to delete this employee?");


            if (answer == false) {

                return;

            }


            employees = employees.filter(function(employee) {

                return employee.id != id;

            });


            localStorage.setItem(
                "employees",
                JSON.stringify(employees)
            );


            showEmployees();

            updateCards();

        }


        function cancelEdit() {

            editId = null;

            clearForm();


            document.getElementById("formTitle").innerText =
                "Add New Employee";

            document.getElementById("saveButton").innerText =
                "Add Employee";

            document.getElementById("cancelButton").style.display =
                "none";

        }


        function clearForm() {

            document.getElementById("name").value = "";
            document.getElementById("age").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("email").value = "";
            document.getElementById("job").value = "";
            document.getElementById("department").value = "";
            document.getElementById("salary").value = "";
            document.getElementById("city").value = "";
            document.getElementById("address").value = "";

        }


        function updateCards() {

            let total =
                employees.length;


            let departments = [];


            for (let i = 0; i < employees.length; i++) {

                if (
                    !departments.includes(
                        employees[i].department
                    )
                ) {

                    departments.push(
                        employees[i].department
                    );

                }

            }


            let totalSalary = 0;


            for (let i = 0; i < employees.length; i++) {

                totalSalary +=
                    employees[i].salary;

            }


            let average = 0;


            if (employees.length > 0) {

                average =
                    totalSalary / employees.length;

            }


            document.getElementById("totalEmployees").innerText =
                total;

            document.getElementById("totalDepartments").innerText =
                departments.length;

            document.getElementById("totalSalary").innerText =
                totalSalary.toLocaleString();

            document.getElementById("averageSalary").innerText =
                Math.round(average).toLocaleString();

        }


        document.getElementById("search")
            .addEventListener("input", function() {

                showEmployees();

            });


        document.getElementById("departmentFilter")
            .addEventListener("change", function() {

                showEmployees();

            });


        document.getElementById("cityFilter")
            .addEventListener("change", function() {

                showEmployees();

            });


        showEmployees();

        updateCards();

    </script>

</body>

</html>
